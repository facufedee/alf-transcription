version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alf-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - BACKEND_PORT=5000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - frontend
    networks:
      - alf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alf-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/.next
    networks:
      - alf-network

networks:
  alf-network:
    driver: bridge
